name: Build MilChat APK (Android 8-9)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-28" "platforms;android-34" "build-tools;34.0.0"

      - name: Build APK for Android 8-9
        run: |
          npm init -y --force
          npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5
          npx cap add android
          npx cap sync android
          sed -i 's/minSdkVersion = .*/minSdkVersion = 26/' android/variables.gradle
          sed -i 's/targetSdkVersion = .*/targetSdkVersion = 28/' android/variables.gradle
          sed -i 's/compileSdkVersion = .*/compileSdkVersion = 34/' android/variables.gradle
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MilChat-Targets-Android-8-9
          path: android/app/build/outputs/apk/debug/app-debug.apk
