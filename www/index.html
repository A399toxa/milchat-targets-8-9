    }

    }

      font-weight: bold;
      text-align: center;
      cursor: pointer;
    }
    .mode-btn + .mode-btn {
      margin-left: 2%;
    }

      background-color: #1f5c38;
      border-color: #369e60;
      color: #ffffff;
    }

      font-weight: bold;
      text-align: center;
      cursor: pointer;
      margin-bottom: 8px;
