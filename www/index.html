<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MilChat Parser (Android 8-9)</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      background-color: #101418;
      color: #eef2f6;
      font-family: Roboto, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.4;
    }
    .wrap {
      padding: 12px;
      max-width: 820px;
      margin: 0 auto;
    }
    .card {
      background-color: #192028;
      border: 1px solid #2b3643;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 18px;
      font-weight: bold;
      margin: 0 0 4px 0;
      color: #ffffff;
    }
    .subtitle {
      font-size: 13px;
      color: #9fb0c2;
      margin: 0 0 12px 0;
    }
    .label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      color: #c7d4e2;
      margin-bottom: 6px;
    }
    textarea, input[type="text"] {
      width: 100%;
      border-radius: 6px;
      border: 1px solid #3c4b5c;
      background-color: #0d1115;
      color: #f3f7fb;
      font-size: 14px;
      padding: 10px;
    }
    textarea {
      min-height: 140px;
      font-family: monospace;
      resize: vertical;
      margin-bottom: 10px;
    }
    input[type="text"] {
      min-height: 44px;
      margin-bottom: 10px;
    }
    .btn {
      display: block;
      width: 100%;
      min-height: 46px;
      padding: 11px 14px;
      border-radius: 6px;
      border: none;
      font-size: 15px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .btn-primary {
      background-color: #2563eb;
      color: #ffffff;
    }
    .btn-success {
      background-color: #1f7a46;
      color: #ffffff;
    }
    .btn-secondary {
      background-color: #26303d;
      color: #e2e8f0;
      border: 1px solid #3c4b5c;
    }
    .status {
      padding: 10px;
      border-radius: 6px;
      background-color: #111822;
      border: 1px solid #2b3a4a;
      color: #d6e4f0;
      font-size: 13px;
      margin-top: 6px;
      word-break: break-word;
    }
    .point-item {
      padding: 8px 10px;
      border-radius: 6px;
      background-color: #11161d;
      border: 1px solid #26313d;
      margin-bottom: 6px;
      font-size: 13px;
    }
    .kml-box {
      min-height: 120px;
      font-size: 12px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="title">MilChat KML Експортер</div>
      <div class="subtitle">Встав текст із координатами, розпізнай точки та збережи KML у пам'ять пристрою</div>

      <label class="label" for="routeName">Назва маршруту / групи</label>
      <input id="routeName" type="text" value="MilChat Targets" />

      <label class="label" for="rawInput">Вхідний текст</label>
      <textarea id="rawInput" placeholder="Встав текст із координатами..."></textarea>

      <button id="parseBtn" class="btn btn-primary" type="button">Розпізнати точки за послідовністю</button>
      <button id="exportBtn" class="btn btn-success" type="button">Зберегти / Експортувати KML</button>
      <button id="copyKmlBtn" class="btn btn-secondary" type="button">Скопіювати KML-текст</button>
      <button id="clearBtn" class="btn btn-secondary" type="button">Очистити</button>

      <div id="statusBox" class="status">Готово до роботи.</div>
    </div>

    <div class="card">
      <div class="label">Схема розташування точок (<span id="pointsCount">0</span>)</div>
      <div id="pointsList">Немає розпізнаних точок.</div>
    </div>

    <div class="card">
      <label class="label" for="kmlOutput">Попередній перегляд KML</label>
      <textarea id="kmlOutput" class="kml-box" readonly placeholder="Тут з'явиться згенерований KML..."></textarea>
    </div>
  </div>

  <script>
    (function () {
      const rawInput = document.getElementById('rawInput');
      const routeNameInput = document.getElementById('routeName');
      const parseBtn = document.getElementById('parseBtn');
      const exportBtn = document.getElementById('exportBtn');
      const copyKmlBtn = document.getElementById('copyKmlBtn');
      const clearBtn = document.getElementById('clearBtn');
      const statusBox = document.getElementById('statusBox');
      const pointsList = document.getElementById('pointsList');
      const pointsCount = document.getElementById('pointsCount');
      const kmlOutput = document.getElementById('kmlOutput');

      let parsedPoints = [];

      function setStatus(msg) {
        statusBox.textContent = msg;
      }

      function escapeXml(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&apos;');
      }

      function parseCoordinatesFromText(text) {
        const lines = text.split(/\r?\n/);
        const coordRegex = /(-?\d{1,2}\.\d{3,})\s*[,;\s]\s*(-?\d{1,3}\.\d{3,})/;
        const results = [];
        let currentContext = '';

        lines.forEach((rawLine) => {
          const line = rawLine.trim();
          if (!line) return;

          const match = line.match(coordRegex);
          if (match) {
            const lat = parseFloat(match[1]);
            const lon = parseFloat(match[2]);
            if (Math.abs(lat) <= 90 && Math.abs(lon) <= 180) {
              const labelPart = line.replace(match[0], '').trim();
              const title = labelPart || currentContext || ('Точка ' + (results.length + 1));
              results.push({
                index: results.length + 1,
                title: title,
                lat: lat,
                lon: lon,
                raw: line
              });
              return;
            }
          }

          currentContext = line;
        });

        return results;
      }

      function buildKml(points, docName) {
        const placemarks = points.map((p) => {
          return [
            '    <Placemark>',
            '      <name>' + escapeXml(p.index + '. ' + p.title) + '</name>',
            '      <description>' + escapeXml(p.raw) + '</description>',
            '      <Point>',
            '        <coordinates>' + p.lon + ',' + p.lat + ',0</coordinates>',
            '      </Point>',
            '    </Placemark>'
          ].join('\n');
        }).join('\n');

        return [
          '<?xml version="1.0" encoding="UTF-8"?>',
          '<kml xmlns="http://www.opengis.net/kml/2.2">',
          '  <Document>',
          '    <name>' + escapeXml(docName || 'MilChat Targets') + '</name>',
          placemarks,
          '  </Document>',
          '</kml>'
        ].join('\n');
      }

      function renderPoints() {
        pointsCount.textContent = String(parsedPoints.length);
        if (!parsedPoints.length) {
          pointsList.textContent = 'Немає розпізнаних точок.';
          kmlOutput.value = '';
          return;
        }

        pointsList.innerHTML = parsedPoints.map((p) => (
          '<div class="point-item"><strong>' + p.index + '. ' + escapeXml(p.title) + '</strong><br>' +
          'Широта: ' + p.lat + ' | Довгота: ' + p.lon + '</div>'
        )).join('');

        kmlOutput.value = buildKml(parsedPoints, routeNameInput.value.trim());
      }

      function getCapacitorFilesystem() {
        const cap = window.Capacitor;
        if (!cap || !cap.Plugins || !cap.Plugins.Filesystem) {
          return null;
        }
        return cap.Plugins.Filesystem;
      }

      async function saveWithCapacitorFilesystem(fs, fileName, kmlText) {
        if (typeof fs.requestPermissions === 'function') {
          try {
            await fs.requestPermissions();
          } catch (_) {}
        }

        const targets = [
          { path: 'Download/' + fileName, directory: 'EXTERNAL_STORAGE', label: 'Внутрішня пам\'ять / Download/' + fileName },
          { path: fileName, directory: 'DOCUMENTS', label: 'Документи / ' + fileName },
          { path: fileName, directory: 'EXTERNAL_STORAGE', label: 'Внутрішня пам\'ять / ' + fileName }
        ];

        let lastError = null;
        for (const target of targets) {
          try {
            const res = await fs.writeFile({
              path: target.path,
              data: kmlText,
              directory: target.directory,
              encoding: 'utf8',
              recursive: true
            });
            return {
              ok: true,
              location: (res && res.uri) ? res.uri : target.label
            };
          } catch (err) {
            lastError = err;
          }
        }

        return {
          ok: false,
          error: lastError && lastError.message ? lastError.message : String(lastError || 'Невідома помилка запису')
        };
      }

      parseBtn.addEventListener('click', function () {
        parsedPoints = parseCoordinatesFromText(rawInput.value);
        renderPoints();
        if (parsedPoints.length > 0) {
          setStatus('Розпізнано точок: ' + parsedPoints.length + '. Можна зберігати або копіювати KML.');
        } else {
          setStatus('Координати не знайдено. Перевір формат (наприклад: 48.5917546, 35.3306532).');
        }
      });

      exportBtn.addEventListener('click', async function () {
        if (!parsedPoints.length) {
          parsedPoints = parseCoordinatesFromText(rawInput.value);
          renderPoints();
        }
        if (!parsedPoints.length) {
          setStatus('Немає точок для експорту.');
          return;
        }

        const kmlText = buildKml(parsedPoints, routeNameInput.value.trim());
        kmlOutput.value = kmlText;
        const fileName = 'milchat_targets.kml';
        const fs = getCapacitorFilesystem();

        if (fs && typeof fs.writeFile === 'function') {
          const saved = await saveWithCapacitorFilesystem(fs, fileName, kmlText);
          if (saved.ok) {
            setStatus('Файл збережено: ' + saved.location + '. Імпортуйте його в MilChat.');
            return;
          }
          setStatus(
            'Не вдалося записати файл через сховище (' + saved.error + '). Перевір дозвіл на пам\'ять або скористайся «Скопіювати KML-текст».'
          );
          return;
        }

        try {
          const blob = new Blob([kmlText], { type: 'application/vnd.google-earth.kml+xml;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = fileName;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          setTimeout(() => URL.revokeObjectURL(url), 3000);

          setStatus(
            'Плагін Filesystem не підключено — запущено браузерне завантаження ' + fileName + '. Якщо файл не з\'явився у Завантаженнях, скопіюй KML нижче.'
          );
        } catch (err) {
          setStatus('Помилка збереження: ' + (err && err.message ? err.message : err));
        }
      });

      copyKmlBtn.addEventListener('click', async function () {
        const text = kmlOutput.value || (parsedPoints.length ? buildKml(parsedPoints, routeNameInput.value.trim()) : '');
        if (!text) {
          setStatus('Спочатку розпізнай точки, щоб сформувати KML.');
          return;
        }
        kmlOutput.value = text;

        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
            setStatus('KML-текст скопійовано в буфер обміну.');
            return;
          }
        } catch (_) {}

        kmlOutput.focus();
        kmlOutput.select();
        try {
          document.execCommand('copy');
          setStatus('KML-текст виділено та скопійовано.');
        } catch (_) {
          setStatus('Виділи текст у полі «Попередній перегляд KML» вручну та скопіюй.');
        }
      });

      clearBtn.addEventListener('click', function () {
        rawInput.value = '';
        parsedPoints = [];
        renderPoints();
        setStatus('Поля очищено.');
      });
    })();
  </script>
</body>
</html>
